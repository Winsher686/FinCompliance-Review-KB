<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>电商合规审查控制台</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:rgba(30, 41, 59, 0.7);
      --text:#e2e8f0;
      --muted:#94a3b8;
      --brand:#38bdf8;
      --brand2:#818cf8;
      --border:rgba(255, 255, 255, 0.1);
      --shadow:0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --risk-high:#ef4444;
      --risk-mid:#f59e0b;
      --risk-low:#22c55e;
      --risk-none:#64748b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background-color:#0f172a;
      background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08) 0%, transparent 50%),
                        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      color:var(--text);
      min-height:100vh;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:1180px;
      margin:0 auto;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border:1px solid var(--border);
      border-radius:16px;
      background:var(--panel);
      backdrop-filter: blur(10px);
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }
    .logo{
      width:38px;height:38px;border-radius:10px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 0 20px rgba(56, 189, 248, 0.4);
    }
    .title{display:flex;flex-direction:column;line-height:1.15}
    .title strong{font-size:15px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .pill{
      font-size:12px;color:var(--muted);border:1px solid var(--border);
      padding:6px 10px;border-radius:999px;background:rgba(15,23,42,0.6);
    }
    .btn{
      border:none;background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;
      transition:opacity .15s;
    }
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn.ok{background:linear-gradient(135deg,#22c55e,#16a34a)}
    .btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
    .grid{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .card{
      border:1px solid var(--border);border-radius:16px;background:var(--panel);
      backdrop-filter: blur(10px);box-shadow:var(--shadow);padding:16px 18px;
    }
    .card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
    .card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
    input[type=text], select, textarea{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
      background:rgba(15,23,42,0.6);color:var(--text);font-size:13px;font-family:inherit;outline:none;
    }
    textarea{resize:vertical;min-height:78px}
    input:focus,select:focus,textarea:focus{border-color:var(--brand)}
    .row{display:flex;gap:10px;align-items:center;margin-top:14px}
    .switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
    /* 进度 */
    .progress{margin-top:14px;padding:12px;border-radius:12px;background:rgba(15,23,42,0.5);border:1px solid var(--border)}
    .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .step{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
    .step.done{background:rgba(34,197,94,0.15);color:#4ade80;border-color:rgba(34,197,94,0.4)}
    .step.running{background:rgba(56,189,248,0.15);color:var(--brand);border-color:rgba(56,189,248,0.4)}
    /* 结果 */
    .result-empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
    .badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
    .badge{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
    .risk{font-weight:700;color:#fff}
    .risk.高{background:var(--risk-high)}
    .risk.中{background:var(--risk-mid)}
    .risk.低{background:var(--risk-low)}
    .risk.无{background:var(--risk-none)}
    .section{margin-top:16px}
    .section h4{margin:0 0 8px;font-size:13px;color:var(--brand)}
    .conclusion{font-size:14px;line-height:1.7;white-space:pre-wrap}
    .finding{
      border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;
      background:rgba(15,23,42,0.45);
    }
    .finding .fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .finding .rid{font-weight:600;color:var(--brand)}
    .sev{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff}
    .sev.高{background:var(--risk-high)}
    .sev.中{background:var(--risk-mid)}
    .sev.低{background:var(--risk-low)}
    .finding .msg{font-size:13px;line-height:1.6;margin-top:6px}
    .finding .meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
    .ev{font-size:12px;line-height:1.7}
    .ev .item{padding:8px 10px;border-left:3px solid var(--brand2);background:rgba(15,23,42,0.4);margin-bottom:6px;border-radius:0 8px 8px 0}
    .ev .src{color:var(--muted);font-size:11px}
    .report{font-size:13px;line-height:1.75;white-space:pre-wrap;background:rgba(15,23,42,0.5);
      border:1px solid var(--border);border-radius:12px;padding:14px;max-height:420px;overflow:auto}
    .hitl{
      margin-top:16px;border:1px solid rgba(245,158,11,0.5);border-radius:12px;padding:14px;
      background:rgba(245,158,11,0.08);
    }
    .hitl h4{margin:0 0 8px;color:var(--risk-mid);font-size:13px}
    .hitl .row{margin-top:10px}
    .graphbox .row{margin-top:10px}
    .path{font-size:12px;font-family:ui-monospace,Consolas,monospace;background:rgba(15,23,42,0.55);
      border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;line-height:1.6;word-break:break-all}
    .muted{color:var(--muted);font-size:12px}
    .err{color:#f87171;font-size:12px;margin-top:8px}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo"></div>
    <div class="title">
      <strong>电商合规审查控制台</strong>
      <span>知识图谱 · 多路检索 · 合规规则 · 人工复核</span>
    </div>
    <div class="top-actions">
      <span class="pill" id="reviewIdPill">未开始</span>
      <span class="pill" id="statusPill">待提交</span>
    </div>
  </div>

  <div class="grid">
    <!-- 左：提交表单 -->
    <div class="card">
      <h3><span class="dot"></span>审查任务</h3>
      <label>审查主体（商家/店铺）</label>
      <input type="text" id="company" placeholder="如：广州XX贸易有限公司" value="广州XX贸易有限公司" />

      <label>审查类型</label>
      <select id="reviewType">
        <option value="general">综合合规审查</option>
        <option value="banned_word">违禁词宣传审查</option>
        <option value="qualification">资质合规审查</option>
        <option value="violation">违规整改审查</option>
        <option value="supply_chain">货源供应链审查</option>
        <option value="price_category">类目与价格审查</option>
        <option value="brand_authorization">品牌授权审查</option>
        <option value="product_compliance">商品综合合规审查</option>
        <option value="report">正式审查报告</option>
      </select>

      <label>问题描述</label>
      <textarea id="question" placeholder="如：该店铺商品宣传是否使用违禁词？资质是否齐全？">该店铺商品宣传是否使用违禁词或极限词？相关资质是否齐全？是否存在未整改的违规处罚？</textarea>

      <div class="row">
        <button class="btn" id="submitBtn">提交审查</button>
        <button class="btn ghost" id="clearBtn">清空</button>
        <label class="switch" style="margin-left:auto">
          <input type="checkbox" id="streamToggle" checked /> 流式进度
        </label>
      </div>
      <div class="err" id="submitErr"></div>

      <div class="progress" id="progressBox" style="display:none">
        <div class="muted" id="progressStatus">等待中…</div>
        <div class="steps" id="steps"></div>
      </div>
    </div>

    <!-- 右：结果 + 图谱 -->
    <div class="card" id="resultCard">
      <h3><span class="dot"></span>审查结果</h3>
      <div id="result">
        <div class="result-empty">提交审查后，此处展示风险等级、结论、证据链与审查报告。</div>
      </div>
      <div id="hitlBox"></div>
    </div>
  </div>

  <!-- 图谱查询 -->
  <div class="card graphbox" style="margin-top:16px">
    <h3><span class="dot"></span>图谱查询</h3>
    <div class="row" style="flex-wrap:wrap">
      <input type="text" id="entName" placeholder="实体名（实体画像/关系）" style="max-width:260px" />
      <button class="btn ghost" id="entBtn">查询实体</button>
    </div>
    <div class="row" style="flex-wrap:wrap">
      <input type="text" id="pathFrom" placeholder="起点实体" style="max-width:220px" />
      <input type="text" id="pathTo" placeholder="终点实体" style="max-width:220px" />
      <input type="text" id="pathHops" placeholder="最大跳数" value="3" style="max-width:110px" />
      <button class="btn ghost" id="pathBtn">查询路径</button>
    </div>
    <div id="graphOut" style="margin-top:12px"></div>
  </div>
</div>

<script>
  const API_BASE = '';
  let currentReviewId = null;
  let currentTaskId = null;
  let es = null;

  const $ = (id) => document.getElementById(id);
  const escapeHtml = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ============ 提交审查 ============
  async function submitReview(){
    const company = $('company').value.trim();
    if(!company){ $('submitErr').textContent = '请填写审查主体'; return; }
    $('submitErr').textContent = '';
    const isStream = $('streamToggle').checked;
    const payload = {
      company,
      review_type: $('reviewType').value,
      question: $('question').value.trim(),
      is_stream: isStream
    };
    $('submitBtn').disabled = true;
    $('statusPill').textContent = '提交中…';
    $('progressBox').style.display = 'block';
    $('progressStatus').textContent = '正在提交…';
    $('steps').innerHTML = '';
    $('hitlBox').innerHTML = '';
    $('result').innerHTML = '<div class="result-empty">审查进行中，请稍候…</div>';

    try{
      const res = await fetch(`${API_BASE}/review`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if(!res.ok){ throw new Error(await res.text() || '请求失败'); }
      const data = await res.json();
      currentReviewId = data.review_id;
      $('reviewIdPill').textContent = 'ID: ' + (data.review_id || '').slice(0,8);

      if(isStream){
        currentTaskId = data.task_id;
        openStream(data.task_id, data.review_id);
        // 兜底轮询，防止 SSE 断连漏掉终态
        pollFallback(data.task_id, data.review_id);
      }else{
        renderResult(data);
        $('statusPill').textContent = data.status || 'completed';
        $('progressStatus').textContent = '已完成';
        $('submitBtn').disabled = false;
      }
    }catch(e){
      $('submitErr').textContent = '提交失败：' + e.message;
      $('statusPill').textContent = '失败';
      $('submitBtn').disabled = false;
    }
  }

  // ============ SSE ============
  function openStream(taskId, reviewId){
    if(es){ es.close(); }
    es = new EventSource(`${API_BASE}/stream/${taskId}`);
    es.addEventListener('progress', (e) => {
      const d = JSON.parse(e.data || '{}');
      renderSteps(d.done_list || [], d.running_list || []);
      $('statusPill').textContent = d.status || 'processing';
      $('progressStatus').textContent = '处理中…';
    });
    es.addEventListener('final', (e) => {
      const d = JSON.parse(e.data || '{}');
      $('progressStatus').textContent = '已完成';
      $('statusPill').textContent = d.status || 'completed';
      es.close(); es = null;
      $('submitBtn').disabled = false;
      loadReview(reviewId || d.review_id);
    });
    es.addEventListener('error', () => { /* 自动重连，交给兜底轮询 */ });
  }

  function pollFallback(taskId, reviewId){
    let n = 0;
    const timer = setInterval(async () => {
      n++;
      if(n > 120){ clearInterval(timer); return; }
      try{
        const res = await fetch(`${API_BASE}/status/${taskId}`);
        if(!res.ok) return;
        const d = await res.json();
        renderSteps(d.done_list || [], d.running_list || []);
        $('statusPill').textContent = d.status || 'processing';
        if(d.status === 'completed' || d.status === 'failed'){
          clearInterval(timer);
          if(es){ es.close(); es = null; }
          $('submitBtn').disabled = false;
          loadReview(reviewId);
        }
      }catch(_){}
    }, 1500);
  }

  function renderSteps(done, running){
    const all = [...done, ...running.filter(x => !done.includes(x))];
    $('steps').innerHTML = all.map(name => {
      const cls = done.includes(name) ? 'done' : 'running';
      return `<span class="step ${cls}">${escapeHtml(name)}</span>`;
    }).join('');
  }

  // ============ 读取并渲染审查结果 ============
  async function loadReview(reviewId){
    if(!reviewId) return;
    try{
      const res = await fetch(`${API_BASE}/review/${reviewId}`);
      if(res.status === 404){ $('result').innerHTML = '<div class="result-empty">审查记录不存在</div>'; return; }
      const data = await res.json();
      renderResult(data);
    }catch(e){
      $('result').innerHTML = '<div class="result-empty">读取结果失败：' + escapeHtml(e.message) + '</div>';
    }
  }

  function riskClass(level){
    const l = (level || '').trim();
    return ['高','中','低','无'].includes(l) ? l : '无';
  }

  function renderResult(d){
    if(!d || !d.status){ $('result').innerHTML = '<div class="result-empty">无结果</div>'; return; }
    let html = '';
    html += `<div class="badges">
        <span class="badge">主体：${escapeHtml(d.company || '-')}</span>
        <span class="badge">类型：${escapeHtml(d.review_type || '-')}</span>
        <span class="badge">状态：${escapeHtml(statusCn(d.status))}</span>
        <span class="badge risk ${riskClass(d.risk_level)}">风险：${escapeHtml(d.risk_level || '无')}</span>
      </div>`;

    if(d.conclusion){
      html += `<div class="section"><h4>审查结论</h4><div class="conclusion">${escapeHtml(d.conclusion)}</div></div>`;
    }

    const findings = d.findings || [];
    if(findings.length){
      html += `<div class="section"><h4>合规规则命中（${findings.length}）</h4>`;
      findings.forEach(f => {
        html += `<div class="finding">
            <div class="fh">
              <span class="rid">${escapeHtml(f.rule_id || '')}</span>
              <span>${escapeHtml(f.rule_name || '')}</span>
              <span class="sev ${riskClass(f.severity)}">${escapeHtml(f.severity || '')}</span>
            </div>
            <div class="msg">${escapeHtml(f.message || '')}</div>
            ${f.regulation ? `<div class="meta">依据：${escapeHtml(f.regulation)}</div>` : ''}
            ${f.suggestion ? `<div class="meta">建议：${escapeHtml(f.suggestion)}</div>` : ''}
            ${(f.evidence && f.evidence.length) ? `<div class="meta">证据：${escapeHtml(f.evidence.join('；'))}</div>` : ''}
          </div>`;
      });
      html += `</div>`;
    }

    const evs = d.evidence_chain || [];
    if(evs.length){
      html += `<div class="section"><h4>证据链（${evs.length}）</h4><div class="ev">`;
      evs.forEach(ev => {
        html += `<div class="item">${escapeHtml(ev.content || '')}
            <div class="src">${escapeHtml(ev.type || '')} ${ev.source ? '· ' + escapeHtml(ev.source) : ''} ${ev.hops != null ? '· ' + ev.hops + '跳' : ''}</div>
          </div>`;
      });
      html += `</div></div>`;
    }

    const paths = d.graph_paths || [];
    if(paths.length){
      html += `<div class="section"><h4>图谱路径（${paths.length}）</h4>`;
      paths.forEach(p => {
        const text = p.path_text || (Array.isArray(p.nodes) ? p.nodes.join(' → ') : JSON.stringify(p));
        html += `<div class="path">${escapeHtml(text)}</div>`;
      });
      html += `</div>`;
    }

    if(d.report){
      html += `<div class="section"><h4>审查报告</h4><div class="report">${escapeHtml(d.report)}</div></div>`;
    }

    $('result').innerHTML = html;

    // HITL 人工复核
    if(d.status === 'pending_approval' || d.needs_human_review){
      $('hitlBox').innerHTML = `
        <div class="hitl">
          <h4>⚠ 高风险命中，需人工复核</h4>
          <div class="muted">请复核上述证据与规则命中情况，确认是否通过。</div>
          <label>复核人</label>
          <input type="text" id="reviewer" placeholder="复核人姓名" />
          <label>复核意见</label>
          <textarea id="reviewComment" placeholder="复核意见（可选）"></textarea>
          <div class="row">
            <button class="btn ok" id="approveBtn">通过</button>
            <button class="btn danger" id="rejectBtn">驳回</button>
          </div>
        </div>`;
      $('approveBtn').onclick = () => approveReview(true);
      $('rejectBtn').onclick = () => approveReview(false);
    }else{
      $('hitlBox').innerHTML = '';
    }
  }

  function statusCn(s){
    return ({processing:'处理中', pending_approval:'待人工复核', approved:'已通过',
      rejected:'已驳回', completed:'已完成', failed:'失败', not_found:'不存在'})[s] || s;
  }

  // ============ 人工审批 ============
  async function approveReview(approved){
    if(!currentReviewId) return;
    const reviewer = ($('reviewer') && $('reviewer').value.trim()) || '';
    const comment = ($('reviewComment') && $('reviewComment').value.trim()) || '';
    try{
      const res = await fetch(`${API_BASE}/review/${currentReviewId}/approve`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({approved, reviewer, comment})
      });
      if(!res.ok){ throw new Error(await res.text() || '审批失败'); }
      const data = await res.json();
      renderResult(data);
      $('statusPill').textContent = data.status || '';
    }catch(e){
      $('submitErr').textContent = '审批失败：' + e.message;
    }
  }

  // ============ 图谱查询 ============
  async function queryEntity(){
    const name = $('entName').value.trim();
    if(!name){ return; }
    $('graphOut').innerHTML = '<div class="muted">查询中…</div>';
    try{
      const res = await fetch(`${API_BASE}/graph/entity/${encodeURIComponent(name)}`);
      const d = await res.json();
      const labels = (d.labels || []).join(', ');
      const props = d.props && Object.keys(d.props).length
        ? Object.entries(d.props).map(([k,v]) => `${escapeHtml(k)}=${escapeHtml(v)}`).join('，') : '无';
      let html = `<div class="badges">
          <span class="badge">实体：${escapeHtml(d.name || name)}</span>
          ${labels ? `<span class="badge">标签：${escapeHtml(labels)}</span>` : ''}
        </div>
        <div class="muted">属性：${props}</div>`;
      const rels = d.relations || [];
      if(rels.length){
        html += `<div class="section"><h4>关系（${rels.length}）</h4>`;
        rels.forEach(r => {
          const p = r.props && Object.keys(r.props).length
            ? ' ' + escapeHtml(Object.entries(r.props).map(([k,v]) => `${k}=${v}`).join(',')) : '';
          html += `<div class="path">${escapeHtml(r.head)} -[${escapeHtml(r.rel)}]-> ${escapeHtml(r.tail)}${p}</div>`;
        });
        html += `</div>`;
      }else{
        html += `<div class="muted" style="margin-top:8px">无关系数据（图谱未连接或无该实体）</div>`;
      }
      $('graphOut').innerHTML = html;
    }catch(e){
      $('graphOut').innerHTML = `<div class="muted">查询失败：${escapeHtml(e.message)}</div>`;
    }
  }

  async function queryPath(){
    const from = $('pathFrom').value.trim();
    const to = $('pathTo').value.trim();
    if(!from || !to){ return; }
    const hops = $('pathHops').value.trim() || '3';
    $('graphOut').innerHTML = '<div class="muted">查询中…</div>';
    try{
      const url = `${API_BASE}/graph/path?from_name=${encodeURIComponent(from)}&to_name=${encodeURIComponent(to)}&max_hops=${encodeURIComponent(hops)}`;
      const res = await fetch(url);
      const d = await res.json();
      const paths = d.paths || [];
      if(!paths.length){
        $('graphOut').innerHTML = `<div class="muted">未找到 ${escapeHtml(from)} → ${escapeHtml(to)} 的路径（最多${d.max_hops||hops}跳）</div>`;
        return;
      }
      let html = `<div class="section"><h4>路径（${paths.length}）</h4>`;
      paths.forEach(p => {
        const text = p.path_text || (Array.isArray(p.nodes) ? p.nodes.join(' → ') : JSON.stringify(p));
        html += `<div class="path">${escapeHtml(text)} <span class="src">(${p.hops || ''}跳)</span></div>`;
      });
      html += `</div>`;
      $('graphOut').innerHTML = html;
    }catch(e){
      $('graphOut').innerHTML = `<div class="muted">查询失败：${escapeHtml(e.message)}</div>`;
    }
  }

  // ============ 事件绑定 ============
  $('submitBtn').onclick = submitReview;
  $('clearBtn').onclick = () => {
    $('question').value = '';
    $('result').innerHTML = '<div class="result-empty">提交审查后，此处展示风险等级、结论、证据链与审查报告。</div>';
    $('hitlBox').innerHTML = '';
    $('steps').innerHTML = '';
    $('progressBox').style.display = 'none';
    $('statusPill').textContent = '待提交';
    $('reviewIdPill').textContent = '未开始';
    if(es){ es.close(); es = null; }
  };
  $('entBtn').onclick = queryEntity;
  $('pathBtn').onclick = queryPath;
</script>
</body>
</html>
